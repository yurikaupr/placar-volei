<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Placar Vôlei - Controle & Transmissão</title>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#050505;
color:white;
overflow:auto;
}

.container{
display:flex;
min-height:100vh;
}

/* ===== CONTROLE ===== */
.control{
width:340px;
background:#111;
padding:25px;
border-right:2px solid #222;
}

h2{ margin-bottom:20px; text-align: center; color: #2563eb;}
h3{ font-size: 14px; text-align: center; margin-bottom: 15px; color: #aaa;}

.teamControl{
background:#1a1a1a;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
font-size:20px;
background:#222;
border:1px solid #333;
color:white;
margin-bottom:15px;
text-align:center;
border-radius: 6px;
}

.pointsControl{
display:flex;
justify-content:center;
gap:10px;
margin:15px 0;
}

button{
border:none;
padding:12px 18px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
transition: 0.2s;
}
button:active { transform: scale(0.95); }

.plus{ background:#16a34a; color:white; font-size: 20px; flex: 1;}
.minus{ background:#dc2626; color:white; font-size: 20px; flex: 1;}
.normal{ background:#333; color:white; width:100%; margin-top:10px;}
.big{ width:100%; padding:15px; margin-top:10px; font-size:17px; background:#2563eb; color:white;}
.blackBtn{ background:black; border:1px solid #555;}
.hdmiBtn{ background:#eab308; color:black;} /* Botão Amarelo de Destaque */
.reset{ background:#b91c1c;}

/* ===== TELA ===== */
.display{
flex:1;
position:relative;
background:black;
display:flex;
justify-content:center;
align-items:center;
padding: 20px;
}

.scoreboard{
width:100%;
display:flex;
justify-content:space-around;
align-items:center;
}

.team{ text-align:center; width:40%;}
.teamName{ font-size:60px; margin-bottom:20px; word-break: break-all;}
.points{ font-size:180px; font-weight:bold; line-height: 1;}
.sets{ font-size:35px; color:#aaa; margin-bottom: 10px;}
.arrow{ font-size:50px; color:yellow; opacity:0; transition: 0.2s;}
.center{ font-size:80px; color:#444;}

.overlay{
position:absolute;
inset:0;
background:black;
display:none;
z-index:99;
}
.hidden{ display:block; }

/* Ocultar a área de controle se a página for aberta em modo "somente transmissão" */
body.tv-only .control { display: none; }

/* Responsividade para o celular / telas menores */
@media (max-width: 900px) {
    .container { flex-direction: column; }
    .control { width: 100%; border-right: none; border-bottom: 2px solid #222; }
    .points { font-size: 100px; }
    .teamName { font-size: 35px; }
    .center { font-size: 40px; }
}
</style>
</head>
<body>

<div class="container">

    <div class="control">
        <h2>Controle</h2>
        <h3>Abra este arquivo no celular para ver ou controlar!</h3>
        
        <button class="big hdmiBtn" onclick="openDisplay()">🖥 Abrir Tela do Placar (HDMI)</button>
        <hr style="border:1px solid #222; margin:15px 0;">

        <div class="teamControl">
            <input id="name1" value="TIME A" onchange="saveName(1, this.value)">
            <div>Pontos</div>
            <div class="pointsControl">
                <button class="minus" onclick="changePoint(1,-1)">-</button>
                <button class="plus" onclick="changePoint(1,1)">+</button>
            </div>
            <div>Sets</div>
            <div class="pointsControl">
                <button class="minus" onclick="changeSet(1,-1)">-</button>
                <button class="plus" onclick="changeSet(1,1)">+</button>
            </div>
            <button class="normal" onclick="timeout(1)">Tempo TIME A</button>
        </div>

        <div class="teamControl">
            <input id="name2" value="TIME B" onchange="saveName(2, this.value)">
            <div>Pontos</div>
            <div class="pointsControl">
                <button class="minus" onclick="changePoint(2,-1)">-</button>
                <button class="plus" onclick="changePoint(2,1)">+</button>
            </div>
            <div>Sets</div>
            <div class="pointsControl">
                <button class="minus" onclick="changeSet(2,-1)">-</button>
                <button class="plus" onclick="changeSet(2,1)">+</button>
            </div>
            <button class="normal" onclick="timeout(2)">Tempo TIME B</button>
        </div>

        <button class="big blackBtn" onclick="toggleBlack()">Tela preta transmissão</button>
        <button class="big reset" onclick="resetAll()">Resetar partida</button>
    </div>

    <div class="display">
        <div class="overlay" id="overlay"></div>
        <div class="scoreboard">
            <div class="team">
                <div class="teamName" id="tvName1">TIME A</div>
                <div class="sets">SETS: <span id="set1">0</span></div>
                <div class="points" id="point1">0</div>
                <div class="arrow" id="arrow1">⏱</div>
            </div>

            <div class="center">VS</div>

            <div class="team">
                <div class="teamName" id="tvName2">TIME B</div>
                <div class="sets">SETS: <span id="set2">0</span></div>
                <div class="points" id="point2">0</div>
                <div class="arrow" id="arrow2">⏱</div>
            </div>
        </div>
    </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, update as dbUpdate } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBqJhhs4dNL99qPfo84pvtTFOhpcVVRDjs",
    authDomain: "placar-de-volei-d501e.firebaseapp.com",
    databaseURL: "https://placar-de-volei-d501e-default-rtdb.firebaseio.com",
    projectId: "placar-de-volei-d501e",
    storageBucket: "placar-de-volei-d501e.firebasestorage.app",
    messagingSenderId: "755859649895",
    appId: "1:755859649895:web:421810dba78133f2616bc2",
    measurementId: "G-WTPM3WF8E6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const placarRef = ref(db, 'partida/');

  let state = {
    name1: "TIME A", name2: "TIME B",
    point1: 0, point2: 0,
    set1: 0, set2: 0,
    timeout: 0, black: false
  };

  // Verifica se a URL atual possui o parâmetro "?tv", se sim, esconde o controle.
  if (window.location.search.includes('tv')) {
    document.body.classList.add('tv-only');
  }

  // Função para abrir o placar limpo em uma nova janela para o HDMI
  window.openDisplay = function() {
    window.open(window.location.href + '?tv', '_blank', 'width=1280,height=720');
  }

  onValue(placarRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      state = data;
      render();
    } else {
      set(placarRef, state);
    }
  });

  function render() {
    const name1Input = document.getElementById('name1');
    const name2Input = document.getElementById('name2');

    // Só atualiza os inputs se eles existirem na página (evita erro na tela do HDMI)
    if(name1Input && document.activeElement !== name1Input) name1Input.value = state.name1;
    if(name2Input && document.activeElement !== name2Input) name2Input.value = state.name2;

    if(document.getElementById('tvName1')) tvName1.innerText = state.name1;
    if(document.getElementById('tvName2')) tvName2.innerText = state.name2;
    if(document.getElementById('point1')) point1.innerText = state.point1;
    if(document.getElementById('point2')) point2.innerText = state.point2;
    if(document.getElementById('set1')) set1.innerText = state.set1;
    if(document.getElementById('set2')) set2.innerText = state.set2;

    if(document.getElementById('arrow1')) arrow1.style.opacity = state.timeout === 1 ? 1 : 0;
    if(document.getElementById('arrow2')) arrow2.style.opacity = state.timeout === 2 ? 1 : 0;

    if(document.getElementById('overlay')) overlay.classList.toggle("hidden", state.black);
  }

  window.changePoint = function(team, val) {
    let currentPoints = state["point" + team] + val;
    if (currentPoints < 0) currentPoints = 0;
    
    let updates = {};
    updates["point" + team] = currentPoints;
    dbUpdate(placarRef, updates);
  }

  window.changeSet = function(team, val) {
    let currentSets = state["set" + team] + val;
    if (currentSets < 0) currentSets = 0;

    let updates = {};
    updates["set" + team] = currentSets;
    dbUpdate(placarRef, updates);
  }

  window.saveName = function(team, name) {
    let updates = {};
    updates["name" + team] = name;
    dbUpdate(placarRef, updates);
  }

  window.timeout = function(team) {
    let targetTimeout = state.timeout === team ? 0 : team;
    dbUpdate(placarRef, { timeout: targetTimeout });
  }

  window.toggleBlack = function() {
    dbUpdate(placarRef, { black: !state.black });
  }

  window.resetAll = function() {
    dbUpdate(placarRef, {
      point1: 0, point2: 0,
      set1: 0, set2: 0,
      timeout: 0, black: false
    });
  }
</script>
</body>
</html>
